# Copy to sync/config.toml (not tracked by git). Every line is optional.

# Folder of the Forever game flavor. Found automatically under
# C:\Program Files (x86)\World of Warcraft\_*_ when the Barysh addon is installed there.
# game_dir = 'C:\Program Files (x86)\World of Warcraft\_forever_'

# Database, backups, log and status. Default: %LOCALAPPDATA%\BaryshSync
# data_dir = 'D:\BaryshData'

# Send addon errors to GitHub issues of this repository (needs `gh auth login`).
# github_issues = true

# How often to check the SavedVariables file, seconds.
# poll_seconds = 2

# Google Sheet with the ledger (sheets: Операции, Капитал по дням, Склад, Доход по занятиям).
# 1. Google Cloud console: create a project, enable "Google Sheets API",
#    create a service account and download its JSON key (keep it outside the repository).
# 2. Create a spreadsheet and share it with the service account's e-mail (editor).
# 3. Put the key path and the spreadsheet ID (from its URL: /d/<ID>/edit) here.
# google_key_file = 'C:\Users\<you>\Documents\barysh-sheets-key.json'
# spreadsheet_id = '1AbC...'
